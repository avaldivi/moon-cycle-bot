name: Check mentions (X)

on:
  schedule:
    - cron: "*/5 * * * *" # every 5 minutes
  workflow_dispatch:

jobs:
  ping-mentions-x-endpoint:
    runs-on: ubuntu-latest
    steps:
      - name: Call the /mentions-x endpoint
        env:
          FLY_APP_URL: ${{ secrets.FLY_APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -f -sS -X POST "$FLY_APP_URL/mentions-x" \
            -H "Authorization: Bearer $CRON_SECRET"
